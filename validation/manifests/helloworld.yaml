#
# Service present in both clusters. Each cluster runs one version, so a reply
# from the other version proves cross-cluster routing. The namespace is set by
# validation/run-tests.sh (kubectl -n).
apiVersion: v1
kind: Service
metadata:
  name: helloworld
  labels:
    app: helloworld
    service: helloworld
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace is chosen by run-tests.sh with kubectl -n
spec:
  selector:
    app: helloworld
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helloworld
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace is chosen by run-tests.sh with kubectl -n
automountServiceAccountToken: false

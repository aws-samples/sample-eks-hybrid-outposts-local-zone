#
# trivy config . --config trivy.yaml
# Accepted findings are listed in .trivyignore with a justification.

scan:
  scanners:
    - misconfig
    - secret
  skip-dirs:
    - "**/.terraform"
    # Helm templates are not valid until rendered; tests/chart covers them.
    - modules/istio-primary/charts
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
exit-code: 1
misconfiguration:
  terraform:
    exclude-downloaded-modules: true
ignorefile: .trivyignore.yaml

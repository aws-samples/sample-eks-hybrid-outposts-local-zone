#
# Creates a semver GitHub release (vX.Y.Z tag + notes grouped by commit type:
# breaking changes, security, features, fixes, docs, maintenance) from main.
# The bump is derived from Conventional Commits since the last tag:
#   BREAKING CHANGE / "type!:"  -> major
#   feat:                       -> minor
#   anything else               -> patch
# Run manually to force a bump level. Skips when nothing changed since the
# last tag. No third-party actions and no AWS credentials are used.

name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derive from commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: create release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          last_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev -- '-' | head -n1 || true)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
            current="${last_tag#v}"
          else
            range="HEAD"
            current="0.0.0"
          fi

          if [ -z "$(git rev-list "$range" --max-count=1)" ]; then
            echo "No commits since ${last_tag:-the start}; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="${BUMP_INPUT:-auto}"
          if [ "$bump" = "auto" ]; then
            subjects="$(git log "$range" --format='%s')"
            bodies="$(git log "$range" --format='%b')"
            if printf '%s\n' "$bodies" | grep -Eq '^BREAKING[ -]CHANGE:' \
               || printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]+\))?!:'; then
              bump=major
            elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]+\))?:'; then
              bump=minor
            else
              bump=patch
            fi
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"

          echo "Previous: ${last_tag:-none}  Bump: ${bump}  Next: ${next}"
          {
            echo "release=true"
            echo "previous=${last_tag}"
            echo "next=${next}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.version.outputs.release == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          range="HEAD"
          [ -n "$PREVIOUS" ] && range="${PREVIOUS}..HEAD"

          # One tab-separated line per commit: sha, subject, body flag.
          # Merge commits are skipped; their content is in the commits they merge.
          log="$(mktemp)"
          git log "$range" --no-merges --format='%h%x09%s' > "$log"
          breaking_shas="$(git log "$range" --no-merges --format='%h%x09%b%x00' \
            | tr '\n' ' ' | tr '\0' '\n' \
            | grep -E 'BREAKING[ -]CHANGE:' | cut -f1 || true)"

          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"

          TAB="$(printf '\t')"
          # section <title> <subject-regex>: prints matching commits, once each.
          section() {
            local title="$1" re="$2" out
            out="$(grep -E "${TAB}(${re})" "$log" | grep -Fvxf "$used" || true)"
            [ -z "$out" ] && return 0
            printf '## %s\n\n' "$title" >> "$notes"
            while IFS=$'\t' read -r sha subject; do
              # Strip the type prefix, keep the scope as bold text.
              msg="$(printf '%s' "$subject" \
                | sed -E 's/^[a-z]+(\(([^)]+)\))?!?: ?/\2|/' \
                | sed -E 's/^\|//; s/^([^|]+)\|/**\1:** /')"
              printf -- '- %s ([`%s`](%s/commit/%s))\n' "$msg" "$sha" "$REPO_URL" "$sha" >> "$notes"
            done <<< "$out"
            printf '\n' >> "$notes"
            printf '%s\n' "$out" >> "$used"
          }

          used="$(mktemp)"
          # Breaking changes first: "!" marker or BREAKING CHANGE footer.
          {
            awk -F'\t' '$2 ~ /^[a-z]+(\([^)]+\))?!:/ { print }' "$log"
            for s in $breaking_shas; do awk -F'\t' -v s="$s" '$1 == s { print }' "$log"; done
          } | awk '!seen[$0]++' > "$used.breaking"
          if [ -s "$used.breaking" ]; then
            printf '## ⚠️ Breaking changes\n\n' >> "$notes"
            while IFS=$'\t' read -r sha subject; do
              printf -- '- %s ([`%s`](%s/commit/%s))\n' "$subject" "$sha" "$REPO_URL" "$sha" >> "$notes"
            done < "$used.breaking"
            printf '\n' >> "$notes"
            cp "$used.breaking" "$used"
          fi

          section "🔒 Security"        '[a-z]+\(security\)|security(\(|:)'
          section "✨ Features"        'feat(\(|:)'
          section "🐛 Bug fixes"       'fix(\(|:)'
          section "📚 Documentation"   'docs(\(|:)'
          section "🧹 Maintenance"     '(ci|chore|refactor|test|build|perf|style|revert)(\(|:)'
          section "Other changes"      '.'

          if [ -n "$PREVIOUS" ]; then
            printf '**Full changelog**: %s/compare/%s...%s\n' "$REPO_URL" "$PREVIOUS" "$NEXT" >> "$notes"
          fi
          cat "$notes"
          echo "notes_file=$notes" >> "$GITHUB_ENV"

      - name: Create release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "$NEXT" \
            --target "$GITHUB_SHA" \
            --title "$NEXT" \
            --notes-file "$notes_file" \
            --latest

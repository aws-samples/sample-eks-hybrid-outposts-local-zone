#
# Creates a semver GitHub release (vX.Y.Z tag + generated notes) from main.
# The bump is derived from Conventional Commits since the last tag:
#   BREAKING CHANGE / "type!:"  -> major
#   feat:                       -> minor
#   anything else               -> patch
# Run manually to force a bump level. Skips when nothing changed since the
# last tag. No third-party actions and no AWS credentials are used.

name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derive from commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: create release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          last_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev -- '-' | head -n1 || true)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
            current="${last_tag#v}"
          else
            range="HEAD"
            current="0.0.0"
          fi

          if [ -z "$(git rev-list "$range" --max-count=1)" ]; then
            echo "No commits since ${last_tag:-the start}; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="${BUMP_INPUT:-auto}"
          if [ "$bump" = "auto" ]; then
            subjects="$(git log "$range" --format='%s')"
            bodies="$(git log "$range" --format='%b')"
            if printf '%s\n' "$bodies" | grep -Eq '^BREAKING[ -]CHANGE:' \
               || printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]+\))?!:'; then
              bump=major
            elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]+\))?:'; then
              bump=minor
            else
              bump=patch
            fi
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"

          echo "Previous: ${last_tag:-none}  Bump: ${bump}  Next: ${next}"
          {
            echo "release=true"
            echo "previous=${last_tag}"
            echo "next=${next}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$NEXT" --generate-notes --latest)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$NEXT" "${args[@]}"

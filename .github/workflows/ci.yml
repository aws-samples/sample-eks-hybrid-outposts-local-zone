#
# Offline quality gates. No AWS credentials are used: all Terraform tests run
# against mocked providers.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.1
  TFLINT_VERSION: v0.64.0
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: make fmt-check

  test:
    name: validate + test (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - modules/edge-vpc
          - modules/vpc-peering
          - modules/eks-edge-cluster
          - modules/mesh-ca
          - modules/istio-primary
          - modules/istio-remote-secret
          - stacks/10-network
          - stacks/20-clusters
          - stacks/30-mesh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', 'stacks/*/.terraform.lock.hcl') }}
      - name: terraform init
        run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false
      - name: terraform validate
        # Modules with configuration_aliases cannot be validated standalone.
        if: matrix.root != 'modules/istio-remote-secret'
        run: terraform -chdir=${{ matrix.root }} validate
      - name: terraform test
        run: terraform -chdir=${{ matrix.root }} test

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset

  chart:
    name: helm chart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm version --short # preinstalled on GitHub-hosted runners
      - run: make test-chart

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version # preinstalled on GitHub-hosted runners
      - run: make shellcheck
      - run: make test-scripts

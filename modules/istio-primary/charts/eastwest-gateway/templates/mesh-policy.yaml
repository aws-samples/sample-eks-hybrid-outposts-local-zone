{{- if .Values.crossNetworkGateway.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: cross-network-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eastwest.labels" . | nindent 4 }}
spec:
  selector:
    istio: eastwestgateway
  servers:
    - port:
        number: {{ .Values.tlsPort }}
        name: tls
        protocol: TLS
      tls:
        mode: AUTO_PASSTHROUGH
      hosts:
        - "*.local"
{{- end }}
{{- if .Values.enforceStrictMtls }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eastwest.labels" . | nindent 4 }}
spec:
  mtls:
    mode: STRICT
{{- end }}
